# AeroSpace owns window tiling; Hammerspoon owns the right-Command key layer.
config-version = 2

after-startup-command = []
start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

# Keep the mouse where it is; this workflow is keyboard-first.
on-focused-monitor-changed = []
automatically-unhide-macos-hidden-apps = false

# AeroSpace workspaces are dynamic. Keeping 1-9 alive makes the numeric layer stable.
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']
on-mode-changed = []

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 10
    inner.vertical = 10
    outer.left = 0
    outer.bottom = 0
    outer.top = 0
    outer.right = 0

# Intentionally empty. Hammerspoon binds right Command and calls the AeroSpace CLI.
[mode.main.binding]

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'layout tiling'
