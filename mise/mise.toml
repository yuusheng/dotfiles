[settings]
idiomatic_version_file_enable_tools = ["pnpm", "yarn", "npm", "node"]
minimum_release_age = "0"

[tools]
go = "latest"
bun = "latest"
node = "lts"
rust = "nightly"
"npm:@antfu/ni" = "latest"
pnpm = "latest"

# Go tooling kept global for editor support and compatibility with the previous Brewfile.
"go:github.com/air-verse/air" = "latest"
"go:github.com/go-delve/delve/cmd/dlv" = "latest"
"go:github.com/kisielk/errcheck" = "latest"
"go:github.com/ramya-rao-a/go-outline" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:github.com/fatih/gomodifytags" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:github.com/jstemmer/gotags" = "latest"
"go:gotest.tools/gotestsum" = "latest"
"go:github.com/koron/iferr" = "latest"
"go:github.com/josharian/impl" = "latest"
"go:github.com/fatih/motion" = "latest"
"go:github.com/bernardo-bruning/ollama-copilot" = "latest"
"go:github.com/mgechev/revive" = "latest"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"

# Cargo tooling kept global for compatibility; project-specific versions belong in project mise.toml files.
cargo-binstall = "latest"
"cargo:cargo-deny" = "latest"
cargo-dist = "latest"
"cargo:cargo-expand" = "latest"
cargo-insta = "latest"
"cargo:cargo-shear" = "latest"
dprint = "latest"
just = "latest"
"cargo:sqlx-cli" = "latest"
"cargo:tree-sitter-cli" = "latest"
"cargo:typos-cli" = "latest"
"cargo:watchexec-cli" = "latest"
